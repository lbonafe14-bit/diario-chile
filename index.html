<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

<link rel="manifest" href="manifest.json">

<link rel="apple-touch-icon" href="icon.png">

<title>Diário Chile</title>

<meta name="theme-color" content="#0F1416">


<style>
  :root{
    /* ---- Chile: cobre do Atacama, azul andino, ouro mineral, vinho do sul, céu do deserto ---- */
    --bg:#0F1416;
    --bg-raised:#151B1E;
    --bg-card:#1A2124;
    --bg-card-2:#1E262A;
    --ink:#ECE6D9;
    --ink-dim:#C9C2B2;
    --muted:#8B9C9E;
    --muted-dim:#6C7C7E;
    --copper:#CE7A34;
    --copper-bright:#E8934A;
    --copper-dim:#8C5525;
    --copper-soft:rgba(206,122,52,.14);
    --andes:#3E8188;
    --andes-bright:#59A2A9;
    --andes-soft:rgba(62,129,136,.14);
    --gold:#C9A227;
    --gold-soft:rgba(201,162,39,.14);
    --wine:#B44A4E;
    --wine-soft:rgba(180,74,78,.16);
    --border:rgba(236,230,217,.09);
    --border-bright:rgba(236,230,217,.18);
    --shadow:0 14px 34px rgba(0,0,0,.38);
    --radius:14px;
    --font-display:Georgia,'Times New Roman',serif;
    --font-body:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
    --font-mono:ui-monospace,SFMono-Regular,Consolas,Menlo,monospace;
  }
  *{box-sizing:border-box;}
  html,body{background:var(--bg);}
  body{
    margin:0;
    background:var(--bg);
    font-family:var(--font-body);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  #app{position:relative; min-height:100vh; overflow-x:hidden; padding-bottom:36px;}
  .stars{position:absolute; inset:0; pointer-events:none; z-index:0;
    background-image:
      radial-gradient(1.5px 1.5px at 8% 12%, rgba(236,230,217,.55), transparent),
      radial-gradient(1.5px 1.5px at 22% 6%, rgba(236,230,217,.4), transparent),
      radial-gradient(1px 1px at 38% 18%, rgba(236,230,217,.5), transparent),
      radial-gradient(1.5px 1.5px at 55% 4%, rgba(236,230,217,.35), transparent),
      radial-gradient(1px 1px at 68% 14%, rgba(236,230,217,.5), transparent),
      radial-gradient(1.5px 1.5px at 82% 8%, rgba(236,230,217,.4), transparent),
      radial-gradient(1px 1px at 93% 20%, rgba(236,230,217,.5), transparent),
      radial-gradient(1.5px 1.5px at 14% 28%, rgba(236,230,217,.3), transparent),
      radial-gradient(1px 1px at 47% 24%, rgba(236,230,217,.35), transparent),
      radial-gradient(1.5px 1.5px at 76% 26%, rgba(236,230,217,.3), transparent);
    background-repeat:no-repeat;
    opacity:.8;
  }
  .rel{position:relative; z-index:1;}
  button{font-family:var(--font-body); cursor:pointer;}
  input,select{font-family:var(--font-body);}
  ::selection{background:var(--copper-soft);}
  button:focus-visible, .input:focus-visible, .day-input:focus-visible, .day-select:focus-visible, .checkbox-btn:focus-visible{
    outline:2px solid var(--gold); outline-offset:2px;
  }
  svg{display:block;}

  .mono{font-family:var(--font-mono);}

  /* ---- signature: andes ridge divider ---- */
  .ridge{display:block; width:100%; height:auto;}
  .ridge-wrap{position:relative; line-height:0;}

  /* ---- cover ---- */
  .cover{
    min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:40px 24px 0; background:var(--bg); position:relative; overflow:hidden;
  }
  .cover-eyebrow{font-size:12px; font-weight:600; color:var(--copper-bright); letter-spacing:3px; text-transform:uppercase; margin-bottom:10px; position:relative; z-index:1;}
  .cover-title{font-family:var(--font-display); font-weight:600; font-style:italic; font-size:76px; color:var(--ink); line-height:.95; position:relative; z-index:1;}
  .cover-dates{font-family:var(--font-mono); font-size:13px; font-weight:500; color:var(--muted); margin-top:14px; letter-spacing:.5px; position:relative; z-index:1;}
  .cover-ridge{width:100%; margin-top:34px; position:relative; z-index:1;}
  .cover-card{position:relative; z-index:1; background:var(--bg-card); border-radius:var(--radius); padding:26px 26px 28px; max-width:400px; width:100%; box-shadow:var(--shadow); text-align:left; border:1px solid var(--border); border-top:2px solid var(--copper); margin:-2px auto 40px;}
  .cover-text{font-size:14px; color:var(--ink-dim); line-height:1.65; font-weight:400; margin-bottom:22px;}

  /* ---- generic top / header ---- */
  .top-row{display:flex; justify-content:space-between; align-items:center; padding:26px 22px 0;}
  .greet-label{font-size:11px; color:var(--copper-bright); font-weight:700; text-transform:uppercase; letter-spacing:2px;}
  .greet-title{font-family:var(--font-display); font-style:italic; font-weight:600; font-size:32px; margin-top:4px; color:var(--ink);}
  .gear-btn{width:38px; height:38px; border-radius:10px; border:1px solid var(--border-bright); background:var(--bg-card); color:var(--ink-dim); font-size:15px; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .header-ridge{margin:14px 20px 0;}

  .countdown-card{position:relative; margin:18px 20px 0; background:var(--bg-card); border-radius:var(--radius); padding:22px 22px 20px; box-shadow:var(--shadow); border:1px solid var(--border); border-image:none; overflow:hidden;}
  .countdown-card::before{content:""; position:absolute; left:0; right:0; top:0; height:2px; background:linear-gradient(90deg, var(--copper), var(--andes));}
  .countdown-eyebrow{font-size:11px; font-weight:700; letter-spacing:2px; text-transform:uppercase; color:var(--muted); position:relative; z-index:1;}
  .countdown-row{display:flex; align-items:baseline; gap:10px; margin-top:6px; position:relative; z-index:1;}
  .countdown-value{font-family:var(--font-display); font-style:italic; font-weight:600; font-size:40px; line-height:1; color:var(--copper-bright);}
  .countdown-sub{font-size:13px; font-weight:500; color:var(--muted); position:relative; z-index:1; margin-top:10px;}
  .countdown-units{display:flex; align-items:center; gap:8px; margin-top:14px; position:relative; z-index:1;}
  .countdown-unit{background:var(--bg-card-2); border:1px solid var(--border); border-radius:10px; padding:10px 4px; text-align:center; flex:1;}
  .countdown-num{font-family:var(--font-mono); font-weight:600; font-size:24px; line-height:1; color:var(--ink); font-variant-numeric:tabular-nums;}
  .countdown-unit-label{font-size:9px; font-weight:600; text-transform:uppercase; letter-spacing:1px; color:var(--muted-dim); margin-top:5px;}
  .countdown-sep{font-weight:600; font-size:16px; color:var(--muted-dim); position:relative; z-index:1;}

  /* ---- tab bar: segmented pill control ---- */
  .tab-bar{display:flex; gap:4px; margin:20px 20px 0; background:var(--bg-raised); border:1px solid var(--border); border-radius:14px; padding:4px;}
  .tab-btn{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; padding:9px 2px; border:none; border-radius:10px; background:transparent; color:var(--muted); font-size:10.5px; font-weight:600; letter-spacing:.2px; transition:background .15s ease, color .15s ease;}
  .tab-btn .tab-icon{display:flex; align-items:center; justify-content:center;}
  .tab-btn.active{background:var(--copper); color:#1A1000;}

  .card{position:relative; margin:18px 20px 0; background:var(--bg-card); border-radius:var(--radius); padding:20px; box-shadow:var(--shadow); border:1px solid var(--border);}
  .card-title{font-family:var(--font-display); font-style:italic; font-weight:600; font-size:19px; margin-bottom:14px; color:var(--ink);}
  .card-eyebrow{font-size:10.5px; font-weight:700; letter-spacing:1.5px; text-transform:uppercase; color:var(--copper-bright); margin-bottom:4px;}

  .setup-card{position:relative; max-width:460px; margin:60px auto 0; padding:30px 26px; background:var(--bg-card); border-radius:var(--radius); box-shadow:var(--shadow); border:1px solid var(--border); border-top:2px solid var(--copper);}
  .eyebrow{font-size:11px; font-weight:700; color:var(--copper-bright); margin-bottom:10px; text-transform:uppercase; letter-spacing:2px;}
  .h1{font-family:var(--font-display); font-style:italic; font-weight:600; font-size:28px; margin:0 0 10px 0; color:var(--ink);}
  .subtext{font-size:13.5px; color:var(--ink-dim); line-height:1.6; margin-bottom:24px; font-weight:400;}
  .field-row{display:flex; gap:12px; margin-bottom:6px;}
  .field{flex:1;}
  .label{font-size:11px; color:var(--muted); font-weight:600; display:block; margin-bottom:7px; letter-spacing:.3px; text-transform:uppercase;}

  .input{width:100%; box-sizing:border-box; padding:12px 14px; border-radius:10px; border:1px solid var(--border-bright); background:var(--bg-raised); font-size:14px; font-weight:500; color:var(--ink); outline:none; margin-bottom:10px; transition:border-color .15s ease;}
  .input::placeholder{color:var(--muted-dim);}
  .input:focus{border-color:var(--copper);}
  .day-input{box-sizing:border-box; padding:10px 13px; border-radius:9px; border:1px solid var(--border-bright); background:var(--bg-raised); font-size:13px; font-weight:500; color:var(--ink); outline:none; width:100%;}
  .day-input::placeholder{color:var(--muted-dim);}
  .day-input:focus{border-color:var(--copper);}
  .day-select{box-sizing:border-box; padding:10px; border-radius:9px; border:1px solid var(--border-bright); background:var(--bg-raised); font-size:12px; font-weight:500; color:var(--ink); outline:none;}

  .primary-btn{width:100%; padding:14px 18px; border-radius:11px; border:none; background:var(--copper); color:#1A1000; font-weight:700; font-size:14px; display:flex; align-items:center; justify-content:center; gap:6px; letter-spacing:.2px;}
  .primary-btn.sage{background:var(--andes); color:#08171A;}
  .cancel-btn{padding:0 18px; border-radius:11px; border:1px solid var(--border-bright); background:transparent; color:var(--ink-dim); font-weight:600; font-size:13px;}

  .hero-card{position:relative; margin:18px 20px 0; background:var(--bg-card); border-radius:var(--radius); padding:26px 24px 22px; color:var(--ink); box-shadow:var(--shadow); border:1px solid var(--border);}
  .hero-card::before{content:""; position:absolute; left:0; right:0; top:0; height:2px; background:linear-gradient(90deg, var(--copper), var(--gold));}
  .hero-label{font-size:11px; font-weight:700; letter-spacing:1.5px; text-transform:uppercase; color:var(--muted); margin-bottom:8px;}
  .hero-value{font-family:var(--font-mono); font-weight:600; font-size:38px; line-height:1; color:var(--ink);}
  .hero-sub{font-size:12px; color:var(--muted); margin-top:10px; font-weight:500;}
  .hero-divider{height:1px; background:var(--border); margin:18px 0 14px;}
  .race-label{font-size:12px; font-weight:600; color:var(--ink-dim); margin-bottom:9px;}
  .race-track{position:relative; height:7px; border-radius:8px; background:var(--bg-raised); overflow:hidden;}
  .race-fill{height:100%; background:linear-gradient(90deg, var(--copper), var(--andes)); transition:width .4s ease;}
  .race-center{position:absolute; left:50%; top:-3px; bottom:-3px; width:1px; background:var(--muted-dim);}

  .bubble-row{display:flex; gap:14px; padding:18px 20px 0;}
  .bubble-card{flex:1; background:var(--bg-card); border-radius:var(--radius); padding:18px 14px; text-align:center; box-shadow:var(--shadow); border:1px solid var(--border);}
  .avatar{width:38px; height:38px; border-radius:50%; margin:0 auto 10px; display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-style:italic; font-weight:600; font-size:16px; border:1px solid var(--border-bright);}
  .bubble-name{font-size:12px; font-weight:600; margin-bottom:6px; color:var(--ink-dim); text-transform:uppercase; letter-spacing:.4px;}
  .bubble-value{font-family:var(--font-mono); font-weight:600; font-size:21px; margin-bottom:10px; line-height:1; color:var(--ink);}
  .bubble-track{height:6px; border-radius:8px; background:var(--bg-raised); overflow:hidden;}
  .bubble-fill{height:100%; border-radius:8px; transition:width .3s ease;}
  .bubble-sub{font-size:11px; color:var(--muted); margin-top:8px; font-weight:500;}

  .warning{margin:14px 20px 0; font-size:12px; font-weight:600; color:#F0C7C9; background:var(--wine-soft); border:1px solid rgba(180,74,78,.3); padding:11px 14px; border-radius:11px; text-align:center;}

  .deposit-open-btn{display:flex; align-items:center; justify-content:center; gap:8px; margin:14px 20px 0; width:calc(100% - 40px); padding:12px 14px; border-radius:11px; border:1px dashed var(--border-bright); background:transparent; color:var(--andes-bright); font-weight:600; font-size:13px;}
  .deposit-card{margin:14px 20px 0; background:var(--bg-card); border-radius:var(--radius); padding:20px; box-shadow:var(--shadow); border:1px solid var(--border); border-top:2px solid var(--andes);}

  .cat-row{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:14px;}
  .chip-radio{display:none;}
  .chip{display:inline-flex; align-items:center; gap:5px; padding:8px 12px; border-radius:9px; border:1px solid var(--border-bright); font-size:12px; font-weight:600; cursor:pointer; background:transparent; color:var(--ink-dim);}
  .chip-radio:checked + .chip{background:var(--copper-soft); border-color:var(--copper); color:var(--copper-bright);}

  .whom-row{display:flex; gap:8px; margin-bottom:14px;}
  .whom-radio{display:none;}
  .whom-btn{flex:1; text-align:center; padding:10px 6px; border-radius:9px; border:1px solid var(--border-bright); background:transparent; color:var(--ink-dim); font-size:12px; font-weight:600; cursor:pointer;}
  .whom-radio:checked + .whom-btn{background:var(--andes-soft); border-color:var(--andes); color:var(--andes-bright);}

  .tx-row{display:flex; align-items:center; gap:12px; padding:11px 0; border-bottom:1px solid var(--border);}
  .tx-row:last-child{border-bottom:none;}
  .tx-icon{width:32px; height:32px; border-radius:8px; display:flex; align-items:center; justify-content:center; flex-shrink:0; font-size:14px; border:1px solid var(--border-bright);}
  .tx-left{flex:1; min-width:0;}
  .tx-desc{font-size:13px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:var(--ink);}
  .tx-meta{font-size:11px; color:var(--muted); margin-top:2px; font-weight:500;}
  .tx-right{display:flex; align-items:center; gap:8px;}
  .tx-amount{font-family:var(--font-mono); font-size:13px; font-weight:600; white-space:nowrap; color:var(--ink);}
  .del-btn{border:none; background:none; cursor:pointer; padding:4px; color:var(--muted-dim); font-size:13px; line-height:1;}

  .empty-state{font-size:13px; color:var(--muted); font-weight:500;}
  .empty-state-small{font-size:12px; color:var(--muted-dim); font-weight:500; font-style:italic; margin:2px 0 12px;}

  .footer{text-align:center; margin-top:28px; font-family:var(--font-display); font-style:italic; font-weight:600; font-size:16px; color:var(--muted-dim);}
  .footer-note{text-align:center; font-size:10.5px; color:var(--muted-dim); margin-top:8px; font-weight:500; padding:0 30px; letter-spacing:.2px;}

  .checklist-progress{font-size:11px; font-weight:600; color:var(--muted); margin-bottom:9px; text-transform:uppercase; letter-spacing:.5px;}
  .progress-track{height:7px; border-radius:8px; background:var(--bg-raised); overflow:hidden;}
  .progress-fill{height:100%; border-radius:8px; background:linear-gradient(90deg, var(--andes), var(--gold)); transition:width .3s ease;}
  .check-row{display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--border);}
  .check-row:last-child{border-bottom:none;}
  .checkbox-btn{width:22px; height:22px; border-radius:6px; border:1px solid var(--border-bright); display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0; background:transparent; color:#08171A; font-size:11px;}
  .checkbox-btn.done{background:var(--andes); border-color:var(--andes); color:#08171A;}
  .check-text{flex:1; font-size:13.5px; font-weight:500; color:var(--ink);}
  .check-text.done{text-decoration:line-through; color:var(--muted-dim);}
  .add-row{display:flex; gap:8px; align-items:center; margin-top:14px;}
  .add-round-btn{width:42px; height:42px; border-radius:11px; border:none; background:var(--copper); display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0; color:#1A1000; font-size:17px; font-weight:600;}

  .roteiro-intro{margin:18px 20px 0;}
  .roteiro-sub{font-family:var(--font-mono); font-size:11.5px; font-weight:500; color:var(--muted); margin-top:4px; letter-spacing:.3px;}
  .day-card{position:relative; margin:14px 20px 0; background:var(--bg-card); border-radius:var(--radius); padding:18px; box-shadow:var(--shadow); border:1px solid var(--border);}
  .day-header{display:flex; align-items:center; gap:13px; margin-bottom:12px;}
  .day-num{font-family:var(--font-mono); font-weight:600; font-size:22px; color:var(--copper-bright); width:40px; text-align:center; line-height:1; background:var(--copper-soft); border-radius:8px; padding:8px 0;}
  .day-weekday{font-size:13px; font-weight:600; text-transform:capitalize; color:var(--ink);}
  .day-month{font-family:var(--font-mono); font-size:10.5px; color:var(--muted); font-weight:500; text-transform:uppercase; letter-spacing:.5px;}
  .day-item-row{display:flex; align-items:flex-start; gap:8px; padding:7px 0;}
  .day-item-dot{font-size:11px; flex-shrink:0; margin-top:2px; color:var(--muted-dim);}
  .day-item-text{flex:1; font-size:13px; font-weight:500; color:var(--ink-dim);}
  .day-item-cost{font-family:var(--font-mono); font-size:11px; color:var(--gold); font-weight:600;}
  .cost-toggle{display:flex; align-items:center; font-size:12px; font-weight:500; color:var(--muted); margin-top:10px;}
  .cost-row{display:flex; gap:8px; margin-top:8px;}
  .add-round-btn-small{margin-top:10px; width:100%; padding:10px 0; border-radius:9px; border:1px solid var(--border-bright); background:transparent; display:flex; align-items:center; justify-content:center; gap:6px; cursor:pointer; color:var(--andes-bright); font-weight:600; font-size:12px;}

  .conv-rate-note{font-family:var(--font-mono); font-size:11.5px; font-weight:500; color:var(--muted); background:var(--bg-raised); padding:11px 13px; border-radius:9px; margin-bottom:18px; border:1px solid var(--border);}
  .conv-result{background:var(--bg-raised); border:1px solid var(--border); border-radius:11px; padding:16px; margin:6px 0 4px;}
  .conv-result-label{font-size:10.5px; font-weight:700; color:var(--gold); text-transform:uppercase; letter-spacing:1px;}
  .conv-result-value{font-family:var(--font-mono); font-weight:600; font-size:30px; color:var(--ink); margin-top:4px;}
  .conv-divider{display:flex; align-items:center; gap:10px; font-size:11px; font-weight:600; color:var(--muted-dim); text-transform:uppercase; letter-spacing:1px; margin:20px 0;}
  .conv-divider::before,.conv-divider::after{content:""; flex:1; height:1px; background:var(--border);}
  .conv-rate-edit{display:flex; align-items:center; gap:10px; margin-bottom:16px;}
  .conv-rate-edit label{font-size:10.5px; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:.5px; flex:1;}
  .conv-rate-edit input{width:92px; padding:9px 10px; border-radius:8px; border:1px solid var(--border-bright); background:var(--bg-raised); color:var(--ink); font-family:var(--font-mono); font-size:13px; font-weight:600; outline:none; text-align:right;}
  .conv-rate-edit input:focus{border-color:var(--copper);}

  .field-error{display:none; align-items:center; gap:6px; font-size:11.5px; font-weight:600; color:#F0C7C9; margin:-4px 0 12px; padding:8px 11px; background:var(--wine-soft); border-radius:8px;}
  .field-error.show{display:flex;}
  .input.error, .day-input.error{border-color:var(--wine); background:rgba(180,74,78,.07);}

  .cat-summary-row{display:flex; align-items:center; gap:11px; padding:9px 0;}
  .cat-summary-icon{width:30px; height:30px; border-radius:8px; display:flex; align-items:center; justify-content:center; background:var(--bg-raised); flex-shrink:0; border:1px solid var(--border-bright);}
  .cat-summary-body{flex:1; min-width:0;}
  .cat-summary-top{display:flex; justify-content:space-between; font-size:12.5px; font-weight:600; color:var(--ink-dim); margin-bottom:6px;}
  .cat-summary-track{height:5px; border-radius:6px; background:var(--bg-raised); overflow:hidden;}
  .cat-summary-fill{height:100%; border-radius:6px; transition:width .3s ease;}
  /* Refinements: calmer surfaces, better touch targets and small-screen rhythm. */
  body{background:radial-gradient(circle at 50% -20%,rgba(62,129,136,.18),transparent 34rem),var(--bg);}
  .card,.hero-card,.countdown-card,.bubble-card,.day-card,.deposit-card,.setup-card,.cover-card{backdrop-filter:blur(10px);}
  .card,.hero-card,.countdown-card,.bubble-card,.day-card,.deposit-card{transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease;}
  @media (hover:hover){.card:hover,.hero-card:hover,.countdown-card:hover,.bubble-card:hover,.day-card:hover,.deposit-card:hover{transform:translateY(-2px);border-color:rgba(236,230,217,.18);}}
  button{min-height:42px;transition:transform .15s ease,filter .15s ease,background .15s ease,border-color .15s ease;}
  button:active{transform:scale(.98);}
  .gear-btn,.del-btn{min-height:0;}
  .backup-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px;}
  .secondary-btn{padding:12px 10px;border-radius:10px;border:1px solid var(--border-bright);background:var(--bg-raised);color:var(--ink-dim);font-size:12px;font-weight:700;}
  .secondary-btn:hover{border-color:var(--andes);color:var(--andes-bright);}
  .backup-note{margin:12px 0 0;color:var(--muted);font-size:11px;line-height:1.5;text-align:center;}
  .file-input{display:none;}
  @media (max-width:420px){
    .cover{padding:30px 18px 0;justify-content:flex-end;}
    .cover-title{font-size:clamp(58px,20vw,76px);}
    .cover-card{padding:22px 20px 24px;margin-bottom:26px;}
    .top-row{padding:22px 16px 0;}.header-ridge{margin:12px 16px 0;}
    .countdown-card,.card,.hero-card,.deposit-card,.day-card{margin-left:16px;margin-right:16px;}
    .tab-bar{margin-left:16px;margin-right:16px;}.bubble-row{padding-left:16px;padding-right:16px;gap:10px;}
    .bubble-card{padding:15px 8px;}.bubble-value{font-size:18px;}.bubble-name{font-size:10.5px;}
    .countdown-units{gap:5px;}.countdown-sep{font-size:12px;}.countdown-num{font-size:20px;}
    .field-row,.cost-row{flex-direction:column;gap:0;}.setup-card{margin:32px 16px 0;padding:26px 20px;}
    .conv-rate-edit{align-items:flex-start;flex-direction:column;}.conv-rate-edit input{width:100%;text-align:left;}
  }
  @media (prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important;animation:none!important;}}
</style>
</head>
<body>
<div id="app"></div>

<script>
(function(){
  "use strict";

  var STORAGE_KEY = "conta-chile-offline-v1";

  // small line-icon set (SVG, currentColor) - keeps a consistent, professional
  // look instead of relying on emoji glyphs that render inconsistently across devices
  var ICONS = {
    gear: function(s){ return '<svg viewBox="0 0 20 20" width="'+s+'" height="'+s+'" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10 6.5a3.5 3.5 0 100 7 3.5 3.5 0 000-7z"/><path d="M10 1.5v2M10 16.5v2M3.6 3.6l1.4 1.4M15 15l1.4 1.4M1.5 10h2M16.5 10h2M3.6 16.4l1.4-1.4M15 5l1.4-1.4"/></svg>'; },
    wallet: function(s){ return '<svg viewBox="0 0 20 20" width="'+s+'" height="'+s+'" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="16" height="11" rx="2"/><path d="M2 8h16"/><circle cx="14.5" cy="11.5" r="1" fill="currentColor" stroke="none"/></svg>'; },
    checklist: function(s){ return '<svg viewBox="0 0 20 20" width="'+s+'" height="'+s+'" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="12" height="15" rx="1.5"/><path d="M7 8.5l1.5 1.5L11 7"/><path d="M7 13h6"/></svg>'; },
    calendar: function(s){ return '<svg viewBox="0 0 20 20" width="'+s+'" height="'+s+'" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="4" width="15" height="13.5" rx="1.5"/><path d="M2.5 8h15M6.5 2.5v3M13.5 2.5v3"/></svg>'; },
    swap: function(s){ return '<svg viewBox="0 0 20 20" width="'+s+'" height="'+s+'" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h11l-3-3M16 13H5l3 3"/></svg>'; },
    food: function(s){ return '<svg viewBox="0 0 20 20" width="'+s+'" height="'+s+'" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 2v6a1.5 1.5 0 003 0V2M6.5 8v10"/><path d="M13.5 2c-1 0-2 1.5-2 4s1 4 2 4v8"/></svg>'; },
    bus: function(s){ return '<svg viewBox="0 0 20 20" width="'+s+'" height="'+s+'" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="4" width="15" height="9" rx="2"/><path d="M2.5 9h15"/><circle cx="6" cy="15.3" r="1.2" fill="currentColor" stroke="none"/><circle cx="14" cy="15.3" r="1.2" fill="currentColor" stroke="none"/></svg>'; },
    mountain: function(s){ return '<svg viewBox="0 0 20 20" width="'+s+'" height="'+s+'" fill="currentColor"><path d="M2 16l4.5-7.5L9.5 13l2-3L18 16H2z"/></svg>'; },
    diamond: function(s){ return '<svg viewBox="0 0 20 20" width="'+s+'" height="'+s+'" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M10 2l4 5-4 11-4-11z"/></svg>'; },
    ticket: function(s){ return '<svg viewBox="0 0 20 20" width="'+s+'" height="'+s+'" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 7V6a1.5 1.5 0 011.5-1.5h12A1.5 1.5 0 0117.5 6v1a1.5 1.5 0 000 3v1a1.5 1.5 0 01-1.5 1.5H4A1.5 1.5 0 012.5 11v-1a1.5 1.5 0 000-3z"/><path d="M8 4.5v11" stroke-dasharray="1.6 1.6"/></svg>'; },
    check: function(s){ return '<svg viewBox="0 0 20 20" width="'+s+'" height="'+s+'" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10.5l4 4 8-9"/></svg>'; },
    close: function(s){ return '<svg viewBox="0 0 20 20" width="'+s+'" height="'+s+'" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M5 5l10 10M15 5L5 15"/></svg>'; },
    plus: function(s){ return '<svg viewBox="0 0 20 20" width="'+s+'" height="'+s+'" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M10 4v12M4 10h12"/></svg>'; },
    dot: function(s){ return '<svg viewBox="0 0 20 20" width="'+s+'" height="'+s+'" fill="currentColor"><circle cx="10" cy="10" r="2.4"/></svg>'; }
  };

  var CATS = [
    { id:"comida", label:"Comida", icon:ICONS.food, bg:"var(--copper-soft)", ink:"var(--copper-bright)" },
    { id:"transporte", label:"Transporte", icon:ICONS.bus, bg:"var(--andes-soft)", ink:"var(--andes-bright)" },
    { id:"passeio", label:"Passeio", icon:ICONS.mountain, bg:"var(--gold-soft)", ink:"var(--gold)" },
    { id:"outro", label:"Outro", icon:ICONS.diamond, bg:"rgba(236,230,217,.08)", ink:"var(--ink-dim)" }
  ];

  var DAY_QUOTES = [
    "cada dia é uma página nova pra escrever",
    "o melhor roteiro é o que ainda vai ser inventado",
    "deixa um espaço pra se perder um pouco",
    "as melhores fotos nascem do que não foi planejado",
    "viajar é colecionar momentos, não só lugares",
    "hoje pode ser só andar sem destino certo",
    "guarda esse dia pra uma aventura de última hora",
    "Às vezes o melhor plano é não ter plano"
  ];

  var TRIP_DATES = ["2026-08-10","2026-08-11","2026-08-12","2026-08-13","2026-08-14","2026-08-15","2026-08-16","2026-08-17"];

  // signature element: andes ridge silhouette, reused on cover / header / footer
  function ridgeSVG(h, opacity){
    h = h || 46;
    opacity = opacity == null ? 1 : opacity;
    return '<div class="ridge-wrap" style="opacity:' + opacity + '">' +
      '<svg class="ridge" viewBox="0 0 400 ' + h + '" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">' +
      '<defs><linearGradient id="ridgeGrad" x1="0" y1="0" x2="1" y2="0">' +
      '<stop offset="0%" stop-color="#3E8188"/><stop offset="55%" stop-color="#CE7A34"/><stop offset="100%" stop-color="#C9A227"/>' +
      '</linearGradient></defs>' +
      '<polygon points="0,' + h + ' 0,' + (h*0.42) + ' 38,' + (h*0.08) + ' 70,' + (h*0.5) + ' 105,' + (h*0.18) + ' 150,' + (h*0.58) + ' 190,' + (h*0.02) + ' 232,' + (h*0.46) + ' 270,' + (h*0.22) + ' 312,' + (h*0.55) + ' 350,' + (h*0.12) + ' 400,' + (h*0.4) + ' 400,' + h + '" fill="url(#ridgeGrad)"/>' +
      '</svg></div>';
  }

  function emptyDays(){
    var o = {};
    TRIP_DATES.forEach(function(d){ o[d] = []; });
    return o;
  }

  function defaultState(){
    return {
      cover:true,
      setupDone:false,
      people:["Você","Namorado"],
      initial:{ p1:0, p2:0 },
      transactions:[],
      checklist:[],
      days:emptyDays(),
      rate:0.0054 // BRL por 1 CLP - editável na aba Câmbio
    };
  }

  var state = loadState();
  var currentTab = "carteira";
  var depositOpen = false;

  function loadState(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(!raw) return defaultState();
      var parsed = JSON.parse(raw);
      var d = defaultState();
      var merged = Object.assign({}, d, parsed);
      merged.checklist = parsed.checklist || [];
      merged.days = Object.assign({}, d.days, parsed.days || {});
      merged.initial = Object.assign({ p1:0, p2:0 }, parsed.initial || {});
      merged.people = parsed.people && parsed.people.length===2 ? parsed.people : d.people;
      merged.rate = (typeof parsed.rate === "number" && parsed.rate > 0) ? parsed.rate : d.rate;
      return merged;
    }catch(e){
      return defaultState();
    }
  }

  function save(){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }catch(e){
      console.error("Falha ao salvar localmente", e);
    }
  }


  window.exportBackup = function(){
    var payload = JSON.stringify({ version:1, exportedAt:new Date().toISOString(), data:state }, null, 2);
    var blob = new Blob([payload], { type:"application/json" });
    var url = URL.createObjectURL(blob);
    var link = document.createElement("a");
    link.href = url;
    link.download = "diario-chile-backup-" + new Date().toISOString().slice(0,10) + ".json";
    document.body.appendChild(link); link.click(); link.remove(); URL.revokeObjectURL(url);
    setBackupNote("Backup baixado. Guarde esse arquivo em um lugar seguro.");
  };

  window.importBackup = function(input){
    var file = input && input.files && input.files[0];
    if(!file) return;
    var reader = new FileReader();
    reader.onload = function(){
      try{
        var imported = JSON.parse(reader.result);
        var incoming = imported.data || imported;
        if(!incoming || !Array.isArray(incoming.transactions) || !Array.isArray(incoming.checklist)) throw new Error("formato");
        if(!window.confirm("Substituir os dados atuais pelo backup selecionado?")) return;
        state = Object.assign(defaultState(), incoming);
        state.days = Object.assign(emptyDays(), incoming.days || {});
        state.initial = Object.assign({p1:0,p2:0}, incoming.initial || {});
        state.people = Array.isArray(incoming.people) && incoming.people.length === 2 ? incoming.people : defaultState().people;
        state.rate = typeof incoming.rate === "number" && incoming.rate > 0 ? incoming.rate : defaultState().rate;
        save(); render();
      }catch(e){ setBackupNote("Não consegui abrir esse backup. Escolha um arquivo gerado pelo Diário Chile."); }
      input.value = "";
    };
    reader.readAsText(file);
  };

  function setBackupNote(message){
    var note = document.getElementById("backup-note");
    if(note) note.textContent = message;
  }
  function fmt(n){
    var v = Math.round(n || 0);
    var sign = v < 0 ? "-" : "";
    var abs = Math.abs(v).toString();
    var withSep = abs.replace(/\B(?=(\d{3})+(?!\d))/g, ".");
    return sign + "$" + withSep;
  }

  function esc(s){
    return String(s == null ? "" : s)
      .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
  }

  function uid(){
    return Date.now().toString(36) + Math.random().toString(36).slice(2,6);
  }

  function dayLabel(iso){
    var d = new Date(iso + "T12:00:00");
    var weekday = d.toLocaleDateString("pt-BR", { weekday:"long" });
    var num = d.toLocaleDateString("pt-BR", { day:"2-digit" });
    var month = d.toLocaleDateString("pt-BR", { month:"short" }).replace(".", "");
    return { weekday:weekday, num:num, month:month };
  }

  function pad2(n){ return n < 10 ? "0" + n : "" + n; }

  function fmtWhen(iso){
    try{
      var d = new Date(iso);
      var datePart = d.toLocaleDateString("pt-BR", { day:"2-digit", month:"2-digit" });
      var timePart = d.toLocaleTimeString("pt-BR", { hour:"2-digit", minute:"2-digit" });
      return datePart + " · " + timePart;
    }catch(e){
      return "";
    }
  }

  function setFieldError(elIds, errorId, message){
    elIds.forEach(function(id){
      var el = document.getElementById(id);
      if(el) el.classList.add("error");
    });
    var errEl = document.getElementById(errorId);
    if(errEl){ errEl.textContent = message; errEl.classList.add("show"); }
  }

  function clearFieldError(elIds, errorId){
    elIds.forEach(function(id){
      var el = document.getElementById(id);
      if(el) el.classList.remove("error");
    });
    var errEl = document.getElementById(errorId);
    if(errEl){ errEl.textContent = ""; errEl.classList.remove("show"); }
  }

  function computeCountdown(){
    var now = new Date();
    var todayISO = now.getFullYear() + "-" + pad2(now.getMonth()+1) + "-" + pad2(now.getDate());
    var start = TRIP_DATES[0];
    var end = TRIP_DATES[TRIP_DATES.length - 1];
    if(todayISO < start){
      return { phase:"before", eyebrow:"contagem regressiva", sub:"para o Chile" };
    }
    if(todayISO <= end){
      var idx = TRIP_DATES.indexOf(todayISO);
      var dayNum = idx >= 0 ? idx + 1 : Math.round((new Date(todayISO + "T00:00:00") - new Date(start + "T00:00:00")) / 86400000) + 1;
      return { phase:"during", eyebrow:"estamos na viagem", value:dayNum, sub:"dia " + dayNum + " de 8" };
    }
    return { phase:"after", eyebrow:"Chile · 2026", value:"—", sub:"a viagem já rolou, saudade" };
  }

  var countdownInterval = null;

  function setupCountdownTick(){
    if(countdownInterval){ clearInterval(countdownInterval); countdownInterval = null; }
    var elD = document.getElementById("cd-d");
    if(!elD) return;
    function tick(){
      var target = new Date(TRIP_DATES[0] + "T00:00:00");
      var diff = target - new Date();
      if(diff <= 0){
        if(countdownInterval){ clearInterval(countdownInterval); countdownInterval = null; }
        render();
        return;
      }
      var d = Math.floor(diff / 86400000);
      var h = Math.floor((diff % 86400000) / 3600000);
      var m = Math.floor((diff % 3600000) / 60000);
      var s = Math.floor((diff % 60000) / 1000);
      var eD = document.getElementById("cd-d");
      var eH = document.getElementById("cd-h");
      var eM = document.getElementById("cd-m");
      var eS = document.getElementById("cd-s");
      if(eD) eD.textContent = pad2(d);
      if(eH) eH.textContent = pad2(h);
      if(eM) eM.textContent = pad2(m);
      if(eS) eS.textContent = pad2(s);
    }
    tick();
    countdownInterval = setInterval(tick, 1000);
  }

  // ---------- actions ----------

  window.openDiary = function(){
    state.cover = false;
    save();
    render();
  };

  window.finishSetup = function(){
    var n1 = document.getElementById("name1").value.trim() || "Você";
    var n2 = document.getElementById("name2").value.trim() || "Namorado";
    var p1 = parseFloat(document.getElementById("init1").value) || 0;
    var p2 = parseFloat(document.getElementById("init2").value) || 0;
    state.setupDone = true;
    state.cover = false;
    state.people = [n1, n2];
    state.initial = { p1:p1, p2:p2 };
    save();
    render();
  };

  window.openSettings = function(){
    currentTab = "config";
    depositOpen = false;
    render();
  };

  window.saveSettings = function(){
    var n1 = document.getElementById("edit-name1").value.trim() || "Você";
    var n2 = document.getElementById("edit-name2").value.trim() || "Namorado";
    var p1 = parseFloat(document.getElementById("edit-init1").value) || 0;
    var p2 = parseFloat(document.getElementById("edit-init2").value) || 0;
    state.people = [n1, n2];
    state.initial = { p1: p1, p2: p2 };
    save();
    currentTab = "carteira";
    render();
  };

  window.switchTab = function(tab){
    currentTab = tab;
    depositOpen = false;
    render();
  };

  window.toggleDepositForm = function(open){
    depositOpen = open;
    render();
  };

  window.addTransaction = function(){
    var descEl = document.getElementById("exp-desc");
    var amountEl = document.getElementById("exp-amount");
    var catEl = document.querySelector('input[name="exp-cat"]:checked');
    var whomEl = document.querySelector('input[name="exp-whom"]:checked');
    var desc = descEl.value.trim();
    var amount = parseFloat(amountEl.value);
    var badFields = [];
    if(!desc) badFields.push("exp-desc");
    if(!amount || amount <= 0) badFields.push("exp-amount");
    if(badFields.length){
      var msg = (!desc && (!amount||amount<=0)) ? "Escreva uma descrição e um valor válido."
        : (!desc ? "Escreva uma descrição para o gasto." : "Informe um valor válido, maior que zero.");
      setFieldError(badFields, "exp-error", msg);
      return;
    }
    clearFieldError(["exp-desc","exp-amount"], "exp-error");
    state.transactions.unshift({
      id: uid(),
      desc: desc,
      amount: amount,
      forWhom: whomEl ? whomEl.value : "split",
      category: catEl ? catEl.value : "outro",
      date: new Date().toISOString()
    });
    save();
    render();
  };

  window.deleteTransaction = function(id){
    state.transactions = state.transactions.filter(function(t){ return t.id !== id; });
    save();
    render();
  };

  window.addDeposit = function(){
    var amountEl = document.getElementById("dep-amount");
    var descEl = document.getElementById("dep-desc");
    var personEl = document.querySelector('input[name="dep-person"]:checked');
    var amount = parseFloat(amountEl.value);
    if(!amount || amount <= 0){
      setFieldError(["dep-amount"], "dep-error", "Informe um valor válido, maior que zero.");
      return;
    }
    clearFieldError(["dep-amount"], "dep-error");
    state.transactions.unshift({
      id: uid(),
      type: "deposit",
      person: personEl ? personEl.value : "p1",
      amount: amount,
      desc: (descEl.value.trim() || "reforço de saldo"),
      date: new Date().toISOString()
    });
    save();
    depositOpen = false;
    render();
  };

  window.addChecklistItem = function(){
    var el = document.getElementById("checklist-draft");
    var text = el.value.trim();
    if(!text){
      setFieldError(["checklist-draft"], "checklist-error", "Escreva algo antes de adicionar.");
      return;
    }
    clearFieldError(["checklist-draft"], "checklist-error");
    state.checklist.push({ id: uid(), text: text, done:false });
    save();
    render();
  };

  window.toggleChecklistItem = function(id){
    state.checklist = state.checklist.map(function(c){
      return c.id === id ? Object.assign({}, c, { done: !c.done }) : c;
    });
    save();
    render();
  };

  window.deleteChecklistItem = function(id){
    state.checklist = state.checklist.filter(function(c){ return c.id !== id; });
    save();
    render();
  };

  window.toggleCostRow = function(iso){
    var row = document.getElementById("cost-row-" + iso);
    var checked = document.getElementById("has-cost-" + iso).checked;
    row.style.display = checked ? "flex" : "none";
  };

  window.addDayActivity = function(iso){
    var textEl = document.getElementById("day-text-" + iso);
    var text = textEl.value.trim();
    var errId = "day-error-" + iso;
    if(!text){
      setFieldError(["day-text-" + iso], errId, "Escreva o que vão fazer nesse dia.");
      return;
    }
    var hasCost = document.getElementById("has-cost-" + iso).checked;
    var costEl = document.getElementById("day-cost-" + iso);
    var whoEl = document.getElementById("day-costwho-" + iso);
    var costRaw = parseFloat(costEl.value);
    if(hasCost && (!costRaw || costRaw <= 0)){
      setFieldError(["day-cost-" + iso], errId, "Informe um valor válido para o custo, ou desmarque a opção.");
      return;
    }
    clearFieldError(["day-text-" + iso, "day-cost-" + iso], errId);
    var cost = hasCost ? costRaw : 0;
    var id = uid();
    var activity = {
      id: id,
      text: text,
      cost: cost,
      costWho: whoEl ? whoEl.value : "split",
      txId: cost > 0 ? ("day-" + id) : null
    };
    state.days[iso] = (state.days[iso] || []).concat([activity]);
    if(cost > 0){
      var lbl = dayLabel(iso);
      state.transactions.unshift({
        id: "day-" + id,
        desc: text + " · " + lbl.num + " " + lbl.month,
        amount: cost,
        forWhom: activity.costWho,
        category: "passeio",
        date: new Date().toISOString(),
        fromDay: iso
      });
    }
    save();
    render();
  };

  window.deleteDayActivity = function(iso, activityId, txId){
    state.days[iso] = (state.days[iso] || []).filter(function(a){ return a.id !== activityId; });
    if(txId){
      state.transactions = state.transactions.filter(function(t){ return t.id !== txId; });
    }
    save();
    render();
  };

  // ---------- render ----------

  function render(){
    var app = document.getElementById("app");
    if(countdownInterval){ clearInterval(countdownInterval); countdownInterval = null; }
    if(state.cover && !state.setupDone){
      app.innerHTML = coverHTML();
      return;
    }
    if(!state.setupDone){
      app.innerHTML = setupHTML();
      return;
    }
    app.innerHTML = mainHTML();
    setupCountdownTick();
  }

  function coverHTML(){
    return (
      '<div class="cover">' +
        '<div class="stars"></div>' +
        '<div class="cover-eyebrow">diário de viagem</div>' +
        '<div class="cover-title">Chile</div>' +
        '<div class="cover-dates">10 — 17 DE AGOSTO, 2026</div>' +
        '<div class="cover-ridge">' + ridgeSVG(90, .9) + '</div>' +
        '<div class="cover-card">' +
          '<p class="cover-text">Um espaço pra organizar a carteira compartilhada, a mala e o roteiro de cada dia. Vamos começar?</p>' +
          '<button class="primary-btn" onclick="openDiary()">Abrir o diário</button>' +
        '</div>' +
      '</div>'
    );
  }

  function setupHTML(){
    var p = state.people;
    return (
      '<div class="rel" style="min-height:100vh;">' +
        '<div class="stars"></div>' +
        '<div class="setup-card">' +
          '<div class="eyebrow">primeira página</div>' +

  function computeBudget(){
    var initial = state.initial;
    var expenseTx = state.transactions.filter(function(t){ return t.type !== "deposit"; });
    var depositTx = state.transactions.filter(function(t){ return t.type === "deposit"; });
    var spentP1 = expenseTx.reduce(function(s,t){ return s + (t.forWhom==="p1"?t.amount:(t.forWhom==="split"?t.amount/2:0)); }, 0);
    var spentP2 = expenseTx.reduce(function(s,t){ return s + (t.forWhom==="p2"?t.amount:(t.forWhom==="split"?t.amount/2:0)); }, 0);
    var depositP1 = depositTx.filter(function(t){ return t.person==="p1"; }).reduce(function(s,t){ return s+t.amount; },0);
    var depositP2 = depositTx.filter(function(t){ return t.person==="p2"; }).reduce(function(s,t){ return s+t.amount; },0);
    var budgetP1 = initial.p1 + depositP1;
    var budgetP2 = initial.p2 + depositP2;
    var remainingP1 = budgetP1 - spentP1;
    var remainingP2 = budgetP2 - spentP2;
    var totalPot = budgetP1 + budgetP2;
    var totalSpent = spentP1 + spentP2;
    var totalRemaining = totalPot - totalSpent;
    var p1Pct = (Math.max(remainingP1,0) / (budgetP1||1)) * 100;
    var p2Pct = (Math.max(remainingP2,0) / (budgetP2||1)) * 100;
    var ratioP1 = budgetP1 ? Math.min(spentP1/budgetP1,1) : 0;
    var ratioP2 = budgetP2 ? Math.min(spentP2/budgetP2,1) : 0;
    var leaderIsP1 = ratioP1 >= ratioP2;
    var gap = Math.abs(ratioP1-ratioP2)*100;
    return { budgetP1:budgetP1, budgetP2:budgetP2, remainingP1:remainingP1, remainingP2:remainingP2,
      totalPot:totalPot, totalSpent:totalSpent, totalRemaining:totalRemaining,
      p1Pct:p1Pct, p2Pct:p2Pct, leaderIsP1:leaderIsP1, gap:gap };
  }

  function fmtBRL(n){
    var v = Math.max(n, 0);
    var parts = v.toFixed(2).split(".");
    var intPart = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ".");
    return "R$ " + intPart + "," + parts[1];
  }

  function fmtCLPplain(n){
    var v = Math.max(Math.round(n), 0);
    var withSep = v.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ".");
    return "$ " + withSep;
  }

  window.updateConversionFromCLP = function(){
    var el = document.getElementById("conv-clp");
    var out = document.getElementById("conv-brl-result");
    if(!el || !out) return;
    var clp = parseFloat(el.value) || 0;
    out.textContent = fmtBRL(clp * state.rate);
  };

  window.updateConversionFromBRL = function(){
    var el = document.getElementById("conv-brl");
    var out = document.getElementById("conv-clp-result");
    if(!el || !out) return;
    var brl = parseFloat(el.value) || 0;
    out.textContent = fmtCLPplain(brl / state.rate);
  };

  window.updateExchangeRate = function(){
    var el = document.getElementById("conv-rate-input");
    var errEl = document.getElementById("rate-error");
    if(!el) return;
    var per1000 = parseFloat(el.value);
    if(!per1000 || per1000 <= 0){
      setFieldError(["conv-rate-input"], "rate-error", "Informe uma cotação válida.");
      return;
    }
    clearFieldError(["conv-rate-input"], "rate-error");
    state.rate = per1000 / 1000;
    save();
    var noteEl = document.getElementById("conv-rate-note");
    if(noteEl) noteEl.textContent = rateNoteText();
    window.updateConversionFromCLP();
    window.updateConversionFromBRL();
  };

      '<div class="conv-rate-edit">' +
        '<label for="conv-rate-input">1.000 CLP valem quantos reais hoje?</label>' +
        '<input id="conv-rate-input" type="number" min="0" step="0.01" inputmode="decimal" value="' + (state.rate*1000).toFixed(2) + '" onchange="updateExchangeRate()">' +
      '</div>' +
      '<div class="field-error" id="rate-error"></div>' +
      '<div class="conv-rate-note" id="conv-rate-note">' + rateNoteText() + '</div>' +

      '<label class="label">quanto custa em pesos chilenos (CLP)</label>' +
      '<input class="input" id="conv-clp" type="number" min="0" step="1" inputmode="numeric" placeholder="ex: 8500" oninput="updateConversionFromCLP()">' +
      '<div class="conv-result">' +
        '<div class="conv-result-label">dá em reais</div>' +
        '<div class="conv-result-value" id="conv-brl-result">R$ 0,00</div>' +
      '</div>' +

      '<div class="conv-divider">ou o caminho contrário</div>' +

      '<label class="label">tenho esse valor em reais (BRL)</label>' +
      '<input class="input" id="conv-brl" type="number" min="0" step="0.01" inputmode="decimal" placeholder="ex: 50" oninput="updateConversionFromBRL()">' +
      '<div class="conv-result">' +
        '<div class="conv-result-label">dá em pesos chilenos</div>' +
        '<div class="conv-result-value" id="conv-clp-result">$ 0</div>' +
      '</div>' +
      '</div>';
    html += '<div class="footer">assim ninguém erra as contas na hora do jantar</div>';
    return html;
  }

  render();
})();
</script>

<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('service-worker.js');
}
</script>

</body>
</html>
